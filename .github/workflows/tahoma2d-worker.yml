name: Tahoma2D free worker smoke test

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/tahoma2d-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tahoma2d-worker-smoke
  cancel-in-progress: true

jobs:
  install-and-launch:
    name: Install and inspect Tahoma2D on a free Linux runner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xz-utils libgl1 libopengl0 libegl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Download and extract official Tahoma2D Debian package
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://github.com/tahoma2d/tahoma2d/releases/download/v1.6.3/Tahoma2D-linux-clang.deb" \
            --output "$RUNNER_TEMP/tahoma2d.deb"
          mkdir -p "$RUNNER_TEMP/tahoma2d-root"
          dpkg-deb -x "$RUNNER_TEMP/tahoma2d.deb" "$RUNNER_TEMP/tahoma2d-root"
          echo "TAHOMA_ROOT=$RUNNER_TEMP/tahoma2d-root" >> "$GITHUB_ENV"
          echo "Tahoma2D files:"
          find "$RUNNER_TEMP/tahoma2d-root/usr" -maxdepth 5 \
            \( -type f -o -type d \) \
            \( -iname '*tahoma*' -o -iname 'stuff' -o -iname '*.js' \) -print | head -200
          test -x "$RUNNER_TEMP/tahoma2d-root/usr/bin/tahoma2d"
          test -d "$RUNNER_TEMP/tahoma2d-root/usr/share/tahoma2d/stuff"

      - name: Inspect Tahoma2D runtime and resource paths
        shell: bash
        run: |
          set +e
          BIN="$TAHOMA_ROOT/usr/bin/tahoma2d"
          LOG="$RUNNER_TEMP/tahoma2d-cli-probe.log"
          : > "$LOG"
          echo "Executable: $BIN" | tee -a "$LOG"
          "$BIN" -version >> "$LOG" 2>&1
          echo "version_exit_code=$?" >> "$LOG"
          "$BIN" -help >> "$LOG" 2>&1
          echo "help_exit_code=$?" >> "$LOG"
          echo "--- resources ---" >> "$LOG"
          find "$TAHOMA_ROOT/usr/share/tahoma2d" -maxdepth 3 -type d -print >> "$LOG" 2>&1
          echo "--- script files ---" >> "$LOG"
          find "$TAHOMA_ROOT/usr/share/tahoma2d" -type f -iname '*.js' -print | head -100 >> "$LOG" 2>&1
          cat "$LOG"
          set -e

      - name: Execute a ToonzScript and save a real scene
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT="$RUNNER_TEMP/tahoma2d-smoke.js"
          OUTPUT="$RUNNER_TEMP/tahoma2d-smoke.tnz"
          LOG="$RUNNER_TEMP/tahoma2d-script.log"
          cat > "$SCRIPT" <<EOF
          var scene = new Scene();
          scene.save("$OUTPUT");
          print("TAHOMA_SCENE_SAVE_OK");
          EOF
          set +e
          timeout --signal=TERM 35s xvfb-run -a "$TAHOMA_ROOT/usr/bin/tahoma2d" -TAHOMA2DROOT "$TAHOMA_ROOT/usr/share/tahoma2d" "$SCRIPT" > "$LOG" 2>&1
          code=$?
          set -e
          cat "$LOG"
          if [ ! -s "$OUTPUT" ]; then
            echo "ToonzScript did not create a non-empty .tnz scene."
            exit 1
          fi
          echo "Verified scene file: $OUTPUT ($(stat -c%s "$OUTPUT") bytes)"
          echo "Tahoma2D script runner exit code: $code"
          echo "TAHOMA_SCRIPT_TEST=passed" >> "$GITHUB_ENV"

      - name: Verify Tahoma2D can start in a virtual display
        shell: bash
        run: |
          set +e
          timeout --signal=TERM 20s xvfb-run -a \
            "$TAHOMA_ROOT/usr/bin/tahoma2d" > "$RUNNER_TEMP/tahoma2d-startup.log" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/tahoma2d-startup.log"
          if [ "$code" -eq 124 ] || [ "$code" -eq 143 ]; then
            echo "Tahoma2D stayed running until the smoke-test timeout; GUI startup appears successful."
          elif [ "$code" -eq 0 ]; then
            echo "Tahoma2D exited normally."
          else
            echo "Tahoma2D startup failed with exit code $code"
            exit "$code"
          fi

      - name: Upload startup and CLI probe logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tahoma2d-runtime-inspection
          path: |
            ${{ runner.temp }}/tahoma2d-startup.log
            ${{ runner.temp }}/tahoma2d-cli-probe.log
            ${{ runner.temp }}/tahoma2d-script.log
            ${{ runner.temp }}/tahoma2d-smoke.tnz
          if-no-files-found: ignore
          retention-days: 3
