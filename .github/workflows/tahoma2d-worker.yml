name: Tahoma2D free worker smoke test

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/tahoma2d-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tahoma2d-worker-smoke
  cancel-in-progress: true

jobs:
  install-and-launch:
    name: Install and inspect Tahoma2D on a free Linux runner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xz-utils libgl1 libopengl0 libegl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Download portable Tahoma2D and restore official resources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tahoma2d"
          curl --fail --location --retry 3 \
            "https://github.com/tahoma2d/tahoma2d/releases/download/v1.6.3/Tahoma2D-linux-clang.tar.gz" \
            --output "$RUNNER_TEMP/tahoma2d-linux.tar.gz"
          tar -xzf "$RUNNER_TEMP/tahoma2d-linux.tar.gz" -C "$RUNNER_TEMP/tahoma2d"
          APPIMAGE="$(find "$RUNNER_TEMP/tahoma2d" -type f -name 'Tahoma2D*.AppImage' -print -quit)"
          if [ -z "$APPIMAGE" ]; then
            echo "Could not locate official Tahoma2D AppImage in release archive."
            find "$RUNNER_TEMP/tahoma2d" -maxdepth 4 -print | head -200
            exit 1
          fi
          chmod +x "$APPIMAGE"
          (cd "$(dirname "$APPIMAGE")" && "./$(basename "$APPIMAGE")" --appimage-extract)
          APPDIR="$(find "$(dirname "$APPIMAGE")" -maxdepth 2 -type d -name squashfs-root -print -quit)"
          if [ -z "$APPDIR" ]; then
            echo "AppImage extraction did not produce squashfs-root."
            exit 1
          fi
          echo "TAHOMA_APPDIR=$APPDIR" >> "$GITHUB_ENV"

          git clone --depth 1 --filter=blob:none --sparse --branch v1.6.3 \
            https://github.com/tahoma2d/tahoma2d.git "$RUNNER_TEMP/tahoma2d-source"
          git -C "$RUNNER_TEMP/tahoma2d-source" sparse-checkout set stuff
          test -d "$RUNNER_TEMP/tahoma2d-source/stuff/config"
          mkdir -p "$HOME/.config/Tahoma2D"
          cp -a "$RUNNER_TEMP/tahoma2d-source/stuff" "$HOME/.config/Tahoma2D/stuff"
          test -d "$HOME/.config/Tahoma2D/stuff/config"
          TAHOMA_ROOT="$HOME/.config/Tahoma2D/stuff"
          mkdir -p "$TAHOMA_ROOT/cache"
          cat > "$HOME/.config/Tahoma2D/SystemVar.ini" <<EOF
          [General]
          TAHOMA2DROOT="$TAHOMA_ROOT"
          TAHOMA2DPROFILES="$TAHOMA_ROOT/profiles"
          TAHOMA2DCACHEROOT="$TAHOMA_ROOT/cache"
          TAHOMA2DCONFIG="$TAHOMA_ROOT/config"
          TAHOMA2DFXPRESETS="$TAHOMA_ROOT/fxs"
          TAHOMA2DLIBRARY="$TAHOMA_ROOT/library"
          TAHOMA2DPROJECTS="$TAHOMA_ROOT/projects"
          TAHOMA2DSTUDIOPALETTE="$TAHOMA_ROOT/studiopalette"
          EOF
          echo "TAHOMA_ROOT=$TAHOMA_ROOT" >> "$GITHUB_ENV"
          echo "Restored official stuff resources and created documented Linux SystemVar.ini"
          echo "AppImage root: $APPDIR"
          echo "Resource root: $TAHOMA_ROOT"
          find "$TAHOMA_ROOT" -maxdepth 2 -type d -print | head -100

      - name: Inspect Tahoma2D runtime and resource paths
        shell: bash
        run: |
          set +e
          BIN="$TAHOMA_APPDIR/AppRun"
          LOG="$RUNNER_TEMP/tahoma2d-cli-probe.log"
          : > "$LOG"
          echo "Executable: $BIN" | tee -a "$LOG"
          "$BIN" -version >> "$LOG" 2>&1
          echo "version_exit_code=$?" >> "$LOG"
          "$BIN" -help >> "$LOG" 2>&1
          echo "help_exit_code=$?" >> "$LOG"
          echo "--- resources ---" >> "$LOG"
          find "$TAHOMA_ROOT" -maxdepth 6 -type d -print >> "$LOG" 2>&1
          echo "--- SystemVar.ini ---" >> "$LOG"
          cat "$HOME/.config/Tahoma2D/SystemVar.ini" >> "$LOG"
          echo "--- script files ---" >> "$LOG"
          find "$TAHOMA_ROOT" -type f -iname '*.js' -print | head -100 >> "$LOG" 2>&1
          cat "$LOG"
          set -e

      - name: Execute a ToonzScript and save a real scene
        shell: bash
        run: |
          set -euo pipefail
          # Tahoma2D's CLI only runs scripts that belong to a registered project.
          # The documented default project is Tahoma stuff/sandbox.
          PROJECT="$TAHOMA_ROOT/sandbox"
          SCENES="$PROJECT/+scenes"
          SCRIPT="$SCENES/tahoma2d-smoke.toonzscript"
          OUTPUT="$SCENES/tahoma2d-smoke.tnz"
          LOG="$RUNNER_TEMP/tahoma2d-script.log"
          mkdir -p "$SCENES"
          cat > "$SCRIPT" <<EOF
          var scene = new Scene();
          scene.save("$OUTPUT");
          print("TAHOMA_SCENE_SAVE_OK");
          EOF
          set +e
          cd "$TAHOMA_APPDIR"
          timeout --signal=TERM 35s xvfb-run -a ./AppRun -TAHOMA2DROOT "$TAHOMA_ROOT" "$SCRIPT" > "$LOG" 2>&1
          code=$?
          set -e
          cat "$LOG"
          if [ ! -s "$OUTPUT" ]; then
            echo "ToonzScript did not create a non-empty .tnz scene inside the default sandbox project."
            echo "Sandbox project files:"
  find "$PROJECT" -maxdepth 3 -type f -print | sort | head -80
  echo "Tahoma2D script runner exit code: $code"
            exit 1
          fi
          echo "Verified scene file: $OUTPUT ($(stat -c%s "$OUTPUT") bytes)"
          echo "Tahoma2D script runner exit code: $code (CLI may return 1 after script dispatch)"
          echo "TAHOMA_SCRIPT_TEST=passed" >> "$GITHUB_ENV"

      - name: Verify Tahoma2D can start in a virtual display
        shell: bash
        run: |
          set +e
          cd "$TAHOMA_APPDIR"
          timeout --signal=TERM 20s xvfb-run -a \
            ./AppRun > "$RUNNER_TEMP/tahoma2d-startup.log" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/tahoma2d-startup.log"
          if [ "$code" -eq 124 ] || [ "$code" -eq 143 ]; then
            echo "Tahoma2D stayed running until the smoke-test timeout; GUI startup appears successful."
          elif [ "$code" -eq 0 ]; then
            echo "Tahoma2D exited normally."
          else
            echo "Tahoma2D startup failed with exit code $code"
            exit "$code"
          fi

      - name: Upload startup and CLI probe logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tahoma2d-runtime-inspection
          path: |
            ${{ runner.temp }}/tahoma2d-startup.log
            ${{ runner.temp }}/tahoma2d-cli-probe.log
            ${{ runner.temp }}/tahoma2d-script.log
            $HOME/.config/Tahoma2D/stuff/sandbox/+scenes/tahoma2d-smoke.tnz
          if-no-files-found: ignore
          retention-days: 3
