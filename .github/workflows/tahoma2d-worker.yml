name: Tahoma2D free worker smoke test

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/tahoma2d-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tahoma2d-worker-smoke
  cancel-in-progress: true

jobs:
  install-and-launch:
    name: Install and inspect Tahoma2D on a free Linux runner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xz-utils libgl1 libopengl0 libegl1 libxkbcommon-x11-0 libxcb-cursor0 python3-pil ffmpeg

      - name: Download portable Tahoma2D and restore official resources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tahoma2d"
          curl --fail --location --retry 3 \
            "https://github.com/tahoma2d/tahoma2d/releases/download/v1.6.3/Tahoma2D-linux-clang.tar.gz" \
            --output "$RUNNER_TEMP/tahoma2d-linux.tar.gz"
          tar -xzf "$RUNNER_TEMP/tahoma2d-linux.tar.gz" -C "$RUNNER_TEMP/tahoma2d"
          APPIMAGE="$(find "$RUNNER_TEMP/tahoma2d" -type f -name 'Tahoma2D*.AppImage' -print -quit)"
          if [ -z "$APPIMAGE" ]; then
            echo "Could not locate official Tahoma2D AppImage in release archive."
            find "$RUNNER_TEMP/tahoma2d" -maxdepth 4 -print | head -200
            exit 1
          fi
          chmod +x "$APPIMAGE"
          (cd "$(dirname "$APPIMAGE")" && "./$(basename "$APPIMAGE")" --appimage-extract)
          APPDIR="$(find "$(dirname "$APPIMAGE")" -maxdepth 2 -type d -name squashfs-root -print -quit)"
          if [ -z "$APPDIR" ]; then
            echo "AppImage extraction did not produce squashfs-root."
            exit 1
          fi
          echo "TAHOMA_APPDIR=$APPDIR" >> "$GITHUB_ENV"

          git clone --depth 1 --filter=blob:none --sparse --branch v1.6.3 \
            https://github.com/tahoma2d/tahoma2d.git "$RUNNER_TEMP/tahoma2d-source"
          git -C "$RUNNER_TEMP/tahoma2d-source" sparse-checkout set stuff
          test -d "$RUNNER_TEMP/tahoma2d-source/stuff/config"
          mkdir -p "$HOME/.config/Tahoma2D"
          cp -a "$RUNNER_TEMP/tahoma2d-source/stuff" "$HOME/.config/Tahoma2D/stuff"
          test -d "$HOME/.config/Tahoma2D/stuff/config"
          TAHOMA_ROOT="$HOME/.config/Tahoma2D/stuff"
          mkdir -p "$TAHOMA_ROOT/cache"
          cat > "$HOME/.config/Tahoma2D/SystemVar.ini" <<EOF
          [General]
          TAHOMA2DROOT="$TAHOMA_ROOT"
          TAHOMA2DPROFILES="$TAHOMA_ROOT/profiles"
          TAHOMA2DCACHEROOT="$TAHOMA_ROOT/cache"
          TAHOMA2DCONFIG="$TAHOMA_ROOT/config"
          TAHOMA2DFXPRESETS="$TAHOMA_ROOT/fxs"
          TAHOMA2DLIBRARY="$TAHOMA_ROOT/library"
          TAHOMA2DPROJECTS="$TAHOMA_ROOT/projects"
          TAHOMA2DSTUDIOPALETTE="$TAHOMA_ROOT/studiopalette"
          EOF
          echo "TAHOMA_ROOT=$TAHOMA_ROOT" >> "$GITHUB_ENV"
          echo "Restored official stuff resources and created documented Linux SystemVar.ini"
          echo "AppImage root: $APPDIR"
          echo "Resource root: $TAHOMA_ROOT"
          find "$TAHOMA_ROOT" -maxdepth 2 -type d -print | head -100

      - name: Inspect Tahoma2D runtime and resource paths
        shell: bash
        run: |
          set +e
          BIN="$TAHOMA_APPDIR/AppRun"
          LOG="$RUNNER_TEMP/tahoma2d-cli-probe.log"
          : > "$LOG"
          echo "Executable: $BIN" | tee -a "$LOG"
          "$BIN" -version >> "$LOG" 2>&1
          echo "version_exit_code=$?" >> "$LOG"
          "$BIN" -help >> "$LOG" 2>&1
          echo "help_exit_code=$?" >> "$LOG"
          echo "--- resources ---" >> "$LOG"
          find "$TAHOMA_ROOT" -maxdepth 6 -type d -print >> "$LOG" 2>&1
          echo "--- SystemVar.ini ---" >> "$LOG"
          cat "$HOME/.config/Tahoma2D/SystemVar.ini" >> "$LOG"
          echo "--- script files ---" >> "$LOG"
          find "$TAHOMA_ROOT" -type f -iname '*.js' -print | head -100 >> "$LOG" 2>&1
          cat "$LOG"
          set -e

      - name: Execute a ToonzScript and save a real scene
        shell: bash
        run: |
          set -euo pipefail
          # Tahoma2D's CLI only runs scripts that belong to a registered project.
          # The documented default project is Tahoma stuff/sandbox.
          PROJECT="$TAHOMA_ROOT/sandbox"
          SCENES="$PROJECT/+scenes"
          SCRIPT="$SCENES/tahoma2d-smoke.toonzscript"
          OUTPUT="$SCENES/tahoma2d-smoke.tnz"
          LOG="$RUNNER_TEMP/tahoma2d-script.log"
          mkdir -p "$SCENES"
          cat > "$SCRIPT" <<EOF
          var scene = new Scene();
          scene.save("$OUTPUT");
          print("TAHOMA_SCENE_SAVE_OK");
          EOF
          set +e
          cd "$TAHOMA_APPDIR"
          timeout --signal=TERM 35s xvfb-run -a ./AppRun -TAHOMA2DROOT "$TAHOMA_ROOT" "$SCRIPT" > "$LOG" 2>&1
          code=$?
          set -e
          cat "$LOG"
          if [ ! -s "$OUTPUT" ]; then
            echo "ToonzScript did not create a non-empty .tnz scene inside the default sandbox project."
            echo "Sandbox project files:"
            find "$PROJECT" -maxdepth 3 -type f -print | sort | head -80
            echo "Tahoma2D script runner exit code: $code"
            exit 1
          fi
          echo "Verified scene file: $OUTPUT ($(stat -c%s "$OUTPUT") bytes)"
          cp "$OUTPUT" "$RUNNER_TEMP/tahoma2d-smoke.tnz"
          echo "Tahoma2D script runner exit code: $code (CLI may return 1 after script dispatch)"
          echo "TAHOMA_SCRIPT_TEST=passed" >> "$GITHUB_ENV"

      - name: Generate a 24-frame test animation source
        shell: bash
        run: |
          set -euo pipefail
          FRAME_DIR="$RUNNER_TEMP/tahoma2d-animation-input"
          mkdir -p "$FRAME_DIR"
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          import os
          out = os.environ["RUNNER_TEMP"] + "/tahoma2d-animation-input"
          os.makedirs(out, exist_ok=True)
          w, h = 640, 360
          for frame in range(1, 25):
              im = Image.new("RGB", (w, h), (22, 31, 50))
              d = ImageDraw.Draw(im)
              d.rectangle((0, 292, w, h), fill=(37, 54, 64))
              x = 70 + int((frame - 1) * 500 / 23)
              y = 205 - int(42 * abs(((frame - 1) % 12) - 6) / 6)
              d.ellipse((x-42, y-42, x+42, y+42), fill=(245, 164, 66), outline=(255, 225, 180), width=5)
              d.ellipse((x-17, y-12, x-5, y+3), fill=(30, 35, 48))
              d.ellipse((x+7, y-12, x+19, y+3), fill=(30, 35, 48))
              d.arc((x-16, y+2, x+16, y+25), start=10, end=170, fill=(30, 35, 48), width=3)
              im.save(os.path.join(out, "frame.%04d.png" % frame))
          print("Generated 24 numbered PNG frames:", out)
          PY

      - name: Build a 24-frame Tahoma2D scene
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$TAHOMA_ROOT/sandbox"
          SCENES="$PROJECT/+scenes"
          FRAME_DIR="$RUNNER_TEMP/tahoma2d-animation-input"
          LEVEL="$SCENES/test-ball..png"
          SCRIPT="$SCENES/tahoma2d-animation.toonzscript"
          SCENE="$SCENES/tahoma2d-animation.tnz"
          LOG="$RUNNER_TEMP/tahoma2d-animation-script.log"
          mkdir -p "$SCENES"
          cat > "$SCRIPT" <<EOF
          var level = new Level();
          for (var i = 1; i <= 24; i++) {
            var digits = ("0000" + i).slice(-4);
            var image = new Image("$FRAME_DIR/frame." + digits + ".png");
            level.setFrame(i, image);
          }
          level.save("$LEVEL");
          var scene = new Scene();
          var loaded = scene.loadLevel("TestBall", "$LEVEL");
          for (var f = 0; f < 24; f++) {
            scene.setCell(f, 0, loaded, f + 1);
          }
          scene.save("$SCENE");
          print("TAHOMA_ANIMATION_SCENE_OK");
          EOF
          set +e
          cd "$TAHOMA_APPDIR"
          timeout --signal=TERM 45s xvfb-run -a ./AppRun "$SCRIPT" > "$LOG" 2>&1
          code=$?
          set -e
          cat "$LOG"
          test -s "$SCENE"
          echo "Animated scene created: $SCENE ($(stat -c%s "$SCENE") bytes)"
          cp "$SCENE" "$RUNNER_TEMP/tahoma2d-animation.tnz"
          echo "TAHOMA_ANIMATION_SCENE=$SCENE" >> "$GITHUB_ENV"

      - name: Render the scene with Tahoma2D compositor
        shell: bash
        run: |
          set -euo pipefail
          COMPOSER="$TAHOMA_APPDIR/usr/bin/tcomposer"
          if [ ! -x "$COMPOSER" ]; then
            echo "tcomposer executable not found at $COMPOSER"
            find "$TAHOMA_APPDIR/usr/bin" -maxdepth 1 -type f -printf '%f\n' | sort | head -100
            exit 1
          fi
          export APPDIR="$TAHOMA_APPDIR"
          export CAMLIBS="$TAHOMA_APPDIR/usr/lib/libgphoto2/2.5.34"
          export IOLIBS="$TAHOMA_APPDIR/usr/lib/libgphoto2_port/0.12.2"
          export QT_PLUGIN_PATH="$TAHOMA_APPDIR/usr/plugins"
          export QT_QPA_PLATFORM=xcb
          export LD_LIBRARY_PATH="$TAHOMA_APPDIR/usr/lib:$TAHOMA_APPDIR/usr/lib/tahoma2d:${LD_LIBRARY_PATH:-}"
          RENDER_DIR="$RUNNER_TEMP/tahoma2d-render"
          mkdir -p "$RENDER_DIR"
          cd "$TAHOMA_APPDIR"
          timeout --signal=TERM 180s xvfb-run -a "$COMPOSER" \
            "$TAHOMA_ANIMATION_SCENE" -o "$RENDER_DIR/frame..png" \
            -range 1 24 -step 1 -nthreads 2 -TAHOMA2DROOT "$TAHOMA_ROOT" \
            > "$RUNNER_TEMP/tahoma2d-render.log" 2>&1
          cat "$RUNNER_TEMP/tahoma2d-render.log"
          COUNT="$(find "$RENDER_DIR" -maxdepth 1 -type f -name 'frame.*.png' | wc -l)"
          echo "Rendered frame count: $COUNT"
          test "$COUNT" -eq 24
          ffmpeg -y -framerate 24 -i "$RENDER_DIR/frame.%04d.png" \
            -c:v libx264 -pix_fmt yuv420p "$RUNNER_TEMP/tahoma2d-test-animation.mp4"
          test -s "$RUNNER_TEMP/tahoma2d-test-animation.mp4"
          echo "TAHOMA_RENDER_TEST=passed" >> "$GITHUB_ENV"

      - name: Verify Tahoma2D can start in a virtual display
        shell: bash
        run: |
          set +e
          cd "$TAHOMA_APPDIR"
          timeout --signal=TERM 20s xvfb-run -a \
            ./AppRun > "$RUNNER_TEMP/tahoma2d-startup.log" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/tahoma2d-startup.log"
          if [ "$code" -eq 124 ] || [ "$code" -eq 143 ]; then
            echo "Tahoma2D stayed running until the smoke-test timeout; GUI startup appears successful."
          elif [ "$code" -eq 0 ]; then
            echo "Tahoma2D exited normally."
          else
            echo "Tahoma2D startup failed with exit code $code"
            exit "$code"
          fi

      - name: Upload startup and CLI probe logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tahoma2d-runtime-inspection
          path: |
            ${{ runner.temp }}/tahoma2d-startup.log
            ${{ runner.temp }}/tahoma2d-cli-probe.log
            ${{ runner.temp }}/tahoma2d-script.log
            ${{ runner.temp }}/tahoma2d-smoke.tnz
            ${{ runner.temp }}/tahoma2d-animation-script.log
            ${{ runner.temp }}/tahoma2d-render.log
            ${{ runner.temp }}/tahoma2d-test-animation.mp4
            ${{ runner.temp }}/tahoma2d-animation-input/
            ${{ runner.temp }}/tahoma2d-render/
            ${{ runner.temp }}/tahoma2d-animation.tnz
          if-no-files-found: ignore
          retention-days: 3
