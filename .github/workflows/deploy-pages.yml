name: Deploy AI Animator to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate HTML and inline JavaScript
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index.html', 'utf8');
          if (!/<html\s+lang=["']fa["']\s+dir=["']rtl["']/.test(html)) throw new Error('Persian RTL document declaration is missing.');
          if (!/<\/html>\s*$/i.test(html)) throw new Error('HTML document closing tag is missing.');
          const ids = [...html.matchAll(/\bid=["']([^"']+)["']/g)].map(match => match[1]);
          const duplicates = ids.filter((id, index) => ids.indexOf(id) !== index);
          if (duplicates.length) throw new Error('Duplicate HTML IDs: ' + [...new Set(duplicates)].join(', '));
          const required = ['requestAutomaticScreenplay', 'extractScreenplayObject', 'generateStudioBackground', 'renderMotionPreview', 'pollRequest'];
          for (const name of required) if (!html.includes(name)) throw new Error('Required animation pipeline component missing: ' + name);
          if (!html.includes('./image-engine.js')) throw new Error('Built-in image engine script is not loaded by the app.');
          const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)];
          let checked = 0;
          for (const [, attrs, source] of scripts) {
            if (/\bsrc\s*=/.test(attrs) || !source.trim()) continue;
            new vm.Script(source, { filename: 'index.html:inline-script-' + (++checked) });
          }
          if (!checked) throw new Error('No inline JavaScript was validated.');
          const workflowFiles = fs.readdirSync('.github/workflows').filter(name => name.endsWith('.yml') || name.endsWith('.yaml'));
          const deployerCount = workflowFiles.reduce((total, name) => total + fs.readFileSync('.github/workflows/' + name, 'utf8').split('\n').filter(line => line.trim().startsWith('uses: actions/deploy-pages@')).length, 0);
          if (deployerCount !== 1) throw new Error('Expected exactly one Pages deployment action, found ' + deployerCount + '.');
          console.log('Validated ' + checked + ' inline scripts, ' + ids.length + ' unique HTML IDs, and one Pages deployer.');
          NODE
      - name: Check browser-side rescue console JavaScript
        run: node --check production-rescue.js
      - name: Check automatic screenplay director
        run: |
          node --check auto-director.js
          node --test tests/auto-director.test.mjs
      - name: Check AI manager browser JavaScript
        run: node --check manager.js
      - name: Check animation production suite JavaScript
        run: node --check production-suite.js
      - name: Run network resilience regression tests
        run: node --test tests/reliability.test.mjs
      - name: Run animation production suite regression tests
        run: node --test tests/production-suite.test.mjs
      - name: Check PostHog browser instrumentation
        run: |
          node --check analytics.js
          node --test tests/posthog.test.mjs
      - name: Check built-in image engine
        run: |
          node --check image-engine.js
          node --test tests/image-engine.test.mjs
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase Edge Function
        run: deno check supabase/functions/fal-gateway/index.ts
      - name: Type-check AI manager Edge Function
        run: deno check supabase/functions/studio-manager/index.ts
  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Generate PostHog browser configuration
        env:
          POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
          POSTHOG_API_HOST: ${{ vars.POSTHOG_API_HOST }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const token = process.env.POSTHOG_PROJECT_TOKEN || '';
          const host = process.env.POSTHOG_API_HOST || '';
          if (token && !/^https:\/\/(eu|us)\.i\.posthog\.com$/.test(host)) {
            throw new Error('POSTHOG_API_HOST must be the EU or US PostHog ingestion host.');
          }
          const config = token && host ? { token, host } : null;
          fs.writeFileSync('posthog-config.js',
            'window.__POSTHOG_CONFIG__ = ' + JSON.stringify(config) + ';\n');
          console.log(config ? 'PostHog browser configuration generated.' :
            'PostHog is not configured; analytics will remain disabled until repository settings are added.');
          NODE
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
